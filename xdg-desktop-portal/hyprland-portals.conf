# xdg-desktop-portal backend choice for Hyprland (~/.config/xdg-desktop-portal/hyprland-portals.conf; it overrides
# /usr/share/xdg-desktop-portal/hyprland-portals.conf). Screen sharing and the rest stay on hyprland / gtk;
# Open / Save dialogs come from Luciole (luciole-git ships the backend, /usr/share/xdg-desktop-portal/portals/luciole.portal).
# A change takes effect after the portal restarts: log out and in (or restart xdg-desktop-portal).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=luciole
